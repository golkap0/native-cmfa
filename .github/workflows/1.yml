name: ZIVPN Native Build
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  BuildAPK:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Manual Clone Mihomo Core
        run: |
          mkdir -p core/src/foss/golang/
          rm -rf core/src/foss/golang/clash
          git clone --depth 1 -b Meta https://github.com/MetaCubeX/mihomo core/src/foss/golang/clash
          cd core/src/foss/golang
          go mod tidy

      - name: Download Geo Assets
        run: |
          mkdir -p service/src/main/assets
          wget -O service/src/main/assets/GeoIP.dat https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
          wget -O service/src/main/assets/GeoSite.dat https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
          ls -lh service/src/main/assets/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (Alpha Release)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAlphaRelease --stacktrace

      - name: Upload Armv7 APK to Telegram
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Pindah ke folder output APK
          cd app/build/outputs/apk/alpha/release/
          
          # Mencari file spesifik yang mengandung 'armeabi-v7a'
          apk_file=$(ls *-armeabi-v7a-*.apk | head -n 1)
          
          if [ -f "$apk_file" ]; then
            echo "Ditemukan: $apk_file. Memulai upload ke Telegram..."
            
            # Kirim file menggunakan cURL
            curl -F document=@"$apk_file" \
                 -F caption="📦 **Build Selesai (Armv7)!**%0AFile: $apk_file%0ABranch: ${{ github.ref_name }}" \
                 "https://api.telegram.org/bot$TG_TOKEN/sendDocument?chat_id=$TG_CHAT_ID"
            
            echo "Upload $apk_file selesai."
          else
            echo "Error: File APK Armv7 tidak ditemukan di direktori output!"
            exit 1
          fi
